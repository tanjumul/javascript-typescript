<!DOCTYPE html>
<html lang="en">
<head> 

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaffee mit Tanju</title>
<style>
  @keyframes warLock {
    0%{
      transform:translateX(0); 
    }
    50%{
      transform:translateX(50px); 
    }
    75%{
      transform:translateX(20px); 
    }
    100%{ 
      transform:translateX(10px); 
    }
  }
  .namedisplay{
    animation-name:warLock; 
    animation-duration:5s;
    animation-iteration-count:infinite; 
  }
 
  @keyframes moveAround {
    0% {
      transform: translateX(0);
    }
    50% {
      transform: translateX(500px);
      color: balck;
    }
    100% {
      transform: translateX(0);
     
    }
  }
  .nameDisplay {
    animation-name: moveAround;  
    animation-duration: 5s;  
    animation-iteration-count: infinite;  
  }
</style>
</head>
<body style="background-color:#212121;  color:#fff">
   
<h1 class="nameDisplay" style="animation-duration:20.043"; >Tanjumul ALOM</h1>
</body>
<script>
    const div = document.createElement('div');
    console.log(div); 
    div.className = "tanjumul";
    div.id = Math.round(Math.random() * 10 + 1);  
    div.setAttribute("title","code-tanjumul"); 
    div.style.backgroundColor = 'green'; 
    div.style.padding = '15px'; 
    // div.innerText = "Tanjumul Codes"; 
    const addText = document.createTextNode("Tanjumul & code"); 
    div.appendChild(addText); 
    document.body.appendChild(div); 


    const anotherDiv = document.createElement('div'); 
    console.log(anotherDiv); 
    anotherDiv.className = "title-titan";
    anotherDiv.setAttribute("title","Bangladesh"); 
    anotherDiv.style.color = "red"; 
    anotherDiv.style.backgroundColor = "white";
    anotherDiv.style.padding="10px";  
    const addtexts = document.createTextNode("Tanjumul loves Marathon"); 
    const secondLine = document.createTextNode("a second line"); 
    anotherDiv.appendChild(secondLine);
    document.body.appendChild(secondLine); 
    anotherDiv.appendChild(addtexts);
    document.body.appendChild(anotherDiv); 


</script>
</html>
